<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline - eAnnadata canteen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      color: #16a34a;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    .icon-container {
      width: 88px;
      height: 88px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #ef4444;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      width: 100%;
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px -5px rgba(22, 163, 74, 0.3);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:hover {
      background: #15803d;
    }
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-badge">🛒 eAnnadata canteen</div>
    <div class="icon-container">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Connection Available</h1>
    <p>Your network switched or disconnected. Please check your WiFi or mobile data connection to continue using eAnnadata canteen.</p>
    <button class="btn" onclick="retryConnection()">Retry Connection</button>
  </div>
  <div class="footer">eAnnadata canteen • Fresh Grocery Delivery</div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        alert("Still offline. Please check your network connection.");
      }
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
